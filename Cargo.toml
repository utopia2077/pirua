[workspace]
resolver = "3"
members = [
    "crates/pi-telemetry",
    "crates/pi-extension-protocol",
    "crates/pi-ai-core",
    "crates/pi-ai-transport",
    "crates/pi-ai-providers",
    "crates/pi-ai",
    "crates/pi-agent-schema",
    "crates/pi-agent-loop",
    "crates/pi-agent-session",
    "crates/pi-agent-sqlite",
    "crates/pi-harness-core",
    "crates/pi-harness-runtime",
    "crates/pi-agent-search",
    "crates/pi-agent",
    "crates/pi-coding-runtime",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
publish = false

[workspace.dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
ring = { version = "=0.17.14", default-features = false, features = ["alloc"] }
zlib-rs = { version = "=0.6.7", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }
brotli-decompressor = { version = "=6.0.0", default-features = false, features = ["std"] }
zstd-safe = { version = "=8.0.0", default-features = false, features = ["std"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "http2"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
log = { version = "=0.4.34", default-features = false, features = ["std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "=1.0.9"
httpdate = "=1.0.3"
hyper = { version = "=1.11.1", default-features = false, features = ["client", "http1", "http2"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
rustls-platform-verifier = { version = "=0.7.0", default-features = false }
h2 = { version = "=0.4.19", default-features = false }
url = "=2.5.8"
jsonschema = { version = "=0.52.1", default-features = false }
pi-agent = { path = "crates/pi-agent" }
pi-agent-loop = { path = "crates/pi-agent-loop" }
pi-agent-schema = { path = "crates/pi-agent-schema" }
pi-agent-search = { path = "crates/pi-agent-search" }
pi-agent-session = { path = "crates/pi-agent-session" }
pi-agent-sqlite = { path = "crates/pi-agent-sqlite" }
pi-ai = { path = "crates/pi-ai" }
pi-ai-core = { path = "crates/pi-ai-core" }
pi-ai-providers = { path = "crates/pi-ai-providers" }
pi-ai-transport = { path = "crates/pi-ai-transport" }
pi-extension-protocol = { path = "crates/pi-extension-protocol" }
pi-harness-core = { path = "crates/pi-harness-core" }
pi-harness-runtime = { path = "crates/pi-harness-runtime" }
pi-telemetry = { path = "crates/pi-telemetry" }
regex = { version = "=1.13.1", default-features = false, features = ["std"] }
ryu-js = { version = "=1.0.3", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
prost = "=0.14.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
