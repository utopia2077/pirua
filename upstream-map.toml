[[divergence]]
id = "extension.remote-event-gap"
upstream_behavior = "Trusted AgentLane.watch provides atomic snapshot-plus-buffer and ordered delivery."
rust_behavior = "Trusted Rust watch preserves that contract; remote event-sink.v1 is bounded and uses Gap plus authorized snapshot resynchronization."
owner = "pi-extension-protocol::wire"
rationale = "A slow or disconnected foreign peer cannot be allowed to block operation settlement or consume unbounded memory."
compatibility_consequence = "Remote passive subscribers must handle Gap/Resync and do not receive a durable sequence across reconnects."
replacement_fixture = "conformance/extension-protocol/event-gap-resync"
revisit_trigger = "A durable remote subscription profile is separately designed."

[[divergence]]
id = "extension.sanitized-after-response"
upstream_behavior = "In-process after_response may observe response headers supplied by the provider adapter."
rust_behavior = "Remote hook peers receive only an allowlisted sanitized header projection."
owner = "pi-extension-protocol::wire"
rationale = "Authorization, cookie, and credential-bearing headers cannot cross an untrusted protocol boundary."
compatibility_consequence = "A JavaScript hook depending on a removed header requires an explicit trusted host adapter or cannot be projected."
replacement_fixture = "conformance/extension-protocol/after-response-redaction"
revisit_trigger = "A security owner approves a scoped header capability."

[[divergence]]
id = "extension.typed-provider-payload-only"
upstream_behavior = "An in-process before_payload callback can receive an arbitrary provider-specific payload object."
rust_behavior = "A remote before_payload hook activates only for an exact negotiated provider payload profile and schema digest."
owner = "pi-extension-protocol::wire"
rationale = "Arbitrary unversioned language objects cannot be safely or compatibly projected across processes."
compatibility_consequence = "Extensions for providers without a published payload schema cannot register this remote hook."
replacement_fixture = "conformance/extension-protocol/payload-schema-gate"
revisit_trigger = "A provider publishes a stable payload profile or the hook is removed upstream."

[[divergence]]
id = "extension.auth-none-provider-v1"
upstream_behavior = "An in-process JavaScript provider can close over credentials or use host credential callbacks."
rust_behavior = "Protocol provider v1 accepts only auth_mode=none and exposes no core-managed secret lookup."
owner = "pi-extension-protocol::wire"
rationale = "Credential custody, refresh, revocation, and sandboxing require a separately approved security boundary."
compatibility_consequence = "A credentialed provider must remain built-in Rust or be configured entirely by an out-of-scope privileged host."
replacement_fixture = "conformance/extension-protocol/provider-secret-gate"
revisit_trigger = "A security owner accepts a versioned signing or credential-broker ADR."

[[divergence]]
id = "agent.store-generation-metadata-repair"
upstream_behavior = "Harness search and precise-rewrite prose require a metadata generation counter, but the SessionMetadata interface omits the field."
rust_behavior = "SessionMetadata has required storeGeneration; new/imported sessions start at zero and precise rewrite increments it atomically."
owner = "pi-agent-session::runtime"
rationale = "Search cursors cannot distinguish a seq-renumbering store replacement without the counter required by the same target specification."
compatibility_consequence = "Rust metadata JSON contains one additional required field; legacy decode supplies zero during normalization."
replacement_fixture = "conformance/session/store-generation-rewrite"
revisit_trigger = "Upstream adds an equivalent field or replaces the cursor-generation mechanism."

[[divergence]]
id = "harness.public-headers-require-classification"
upstream_behavior = "AgentHarnessStreamOptions accepts an arbitrary headers map that the operation captures durably."
rust_behavior = "The JSON map shape is preserved, but only headers explicitly classified public by host policy may enter durable state; default policy allows none."
owner = "pi-agent-schema::types"
rationale = "Arbitrary headers can contain credentials, contradicting the accepted invariant that credentials never enter operation state."
compatibility_consequence = "Callers using durable custom headers must register a public-header policy; secret headers remain transient auth/middleware input."
replacement_fixture = "conformance/harness/public-header-policy"
revisit_trigger = "Upstream separates durable public headers from transient credential headers."

[[divergence]]
id = "ai.stream-post-terminal-rejection"
upstream_behavior = "EventStream silently ignores events pushed after its terminal flag is set."
rust_behavior = "AssistantStream returns AlreadySettled for a duplicate terminal or progress after settlement while preserving the first terminal and result."
owner = "pi-ai-core::domain"
rationale = "A typed rejection makes provider misuse causally testable without changing the already authoritative terminal trace."
compatibility_consequence = "A trusted Rust producer that emits after settlement observes an error instead of a silent no-op; consumers observe the same first terminal."
replacement_fixture = "conformance/ai-domain/stream-post-terminal"
revisit_trigger = "Upstream adopts explicit post-terminal rejection or the Rust producer API is replaced."

[[divergence]]
id = "ai.event-stream-producer-capability"
upstream_behavior = "The public generic EventStream constructor exposes push and end, using caller callbacks to decide terminal events and extract results."
rust_behavior = "Rust exposes generic EventStream only as a non-clone consumer; create_assistant_message_event_stream returns the sole public producer, which validates assistant terminal events and has no generic end."
owner = "pi-ai-core::domain"
rationale = "An unrestricted generic producer could close without a result or bypass the assistant terminal invariant; callback identity is not part of the language-neutral core."
compatibility_consequence = "Direct SDK callers may consume the generic stream but use the validated assistant factory for production; arbitrary event channels use their own application abstraction."
replacement_fixture = "conformance/ai-domain/event-stream-capability"
revisit_trigger = "Upstream replaces callback-selected terminal semantics with a typed producer capability or Rust adopts another validated generic protocol."

[[divergence]]
id = "ai.retry-abort-message-required"
upstream_behavior = "retryAssistantCall clears errorMessage when cancellation wins during backoff."
rust_behavior = "The stateless Rust compatibility helper returns an aborted assistant message with a fixed nonempty sanitized error message."
owner = "pi-ai::facade"
rationale = "All settled aborted assistant messages must satisfy the shared terminal invariant and remain distinguishable from malformed state."
compatibility_consequence = "Callers see a constant errorMessage on backoff cancellation where JavaScript returns undefined."
replacement_fixture = "conformance/ai-compat/retry-backoff-abort"
revisit_trigger = "Upstream requires a nonempty aborted-message error or the terminal invariant changes."

[[divergence]]
id = "ai.session-resource-token-registry"
upstream_behavior = "Session resources live in a process-global Set keyed by callback identity and cleanup iterates the live Set."
rust_behavior = "Each runtime owns a token-keyed registry; cleanup invokes an insertion-ordered snapshot, rejects nesting, aggregates redacted failures, and lets explicit removal win."
owner = "pi-ai-core::domain"
rationale = "Callback identity and live-Set reentrancy are not language-neutral and make cleanup ordering and mutation behavior nondeterministic."
compatibility_consequence = "Duplicate registration gets distinct tokens; registration/removal during cleanup affects the next pass; foreign peers use lifecycle messages."
replacement_fixture = "conformance/ai-domain/session-resource-registry"
revisit_trigger = "Upstream defines a language-neutral lifecycle protocol with deterministic reentrancy semantics."

[[divergence]]
id = "ai.resolved-endpoint-custody"
upstream_behavior = "Models applies a credential-selected base URL by mutating a per-request clone of the model before provider dispatch."
rust_behavior = "A non-Serde ResolvedRequest carries a fully redacted RequestEndpoint and leaves model/store DTOs byte-equivalent."
owner = "pi-ai-core::models-auth"
rationale = "Credential endpoints must not become serializable model metadata or leak through ordinary model Debug output."
compatibility_consequence = "Rust adapters consume expose_for_transport on the resolved endpoint instead of reading an overwritten model.baseUrl."
replacement_fixture = "conformance/ai-models/resolved-endpoint-custody"
revisit_trigger = "Upstream separates request endpoints from storable model metadata with equivalent custody."

[[divergence]]
id = "ai.request-callbacks-construction-time"
upstream_behavior = "Provider request options may carry per-request fetch and transformHeaders JavaScript callbacks."
rust_behavior = "Portable core carries no transport or middleware callback; S04 adapters capture trusted transport and middleware capabilities at construction."
owner = "pi-ai-transport::utils"
rationale = "A callback-bearing request object cannot cross the language-neutral extension boundary and would invert the core-to-transport dependency."
compatibility_consequence = "Callers needing a custom transport or header transform construct an adapter/runtime profile instead of attaching a function to one request."
replacement_fixture = "conformance/ai-transport/construction-time-services"
revisit_trigger = "A versioned language-neutral per-request transport/middleware capability is approved."

[[divergence]]
id = "ai.model-header-public-classification"
upstream_behavior = "Model and model-store DTOs accept arbitrary provider headers, including credential-bearing names, and later merge them into request auth."
rust_behavior = "Raw model headers require a host public-header allowlist, seven credential names are always denied case-insensitively, and restored entries are reclassified under current policy."
owner = "pi-ai-core::domain"
rationale = "Credential-capable headers cannot enter serializable model metadata or durable cache state by default."
compatibility_consequence = "Header-bearing custom or cached models require explicit public classification; denied names fail validation instead of reaching dispatch."
replacement_fixture = "conformance/ai-models/model-header-public-classification"
revisit_trigger = "Upstream separates public model metadata from transient credential headers with an equivalent deny policy."

[[divergence]]
id = "ai.credential-mutation-value-lease"
upstream_behavior = "CredentialStore.modify receives and executes an asynchronous JavaScript read-modify-write callback under provider serialization."
rust_behavior = "CredentialStore grants a revisioned exclusive mutation lease with detached current state and a value-only commit capability."
owner = "pi-ai-core::models-auth"
rationale = "Callback identity and executable closures are not language-neutral transaction authority, while rotating OAuth tokens still require exclusive recheck."
compatibility_consequence = "Custom stores implement begin_mutation/current/commit semantics or use an adapter; callers cannot send executable mutation callbacks."
replacement_fixture = "conformance/ai-models/credential-mutation-value-lease"
revisit_trigger = "Upstream publishes a value-based transaction or lease protocol with equivalent refresh serialization."

[[divergence]]
id = "ai.credential-outcome-unknown-quarantine"
upstream_behavior = "Best-effort credential stores may continue serving an in-memory view while recording persistence errors internally."
rust_behavior = "An admitted mutation whose post-state cannot be proved creates durable provider quarantine until explicit replace/delete reconciliation."
owner = "pi-ai-core::models-auth"
rationale = "Authentication must not use, refresh, or overwrite a credential whose durable state is causally unknown."
compatibility_consequence = "Stored and ambient auth plus credential listing fail with OutcomeUnknown after ambiguous persistence instead of serving a best-effort value."
replacement_fixture = "conformance/ai-models/credential-outcome-unknown-quarantine"
revisit_trigger = "Upstream defines a durable ambiguous-outcome recovery protocol with equivalent safety."

[[divergence]]
id = "ai.cache-before-credential-read"
upstream_behavior = "Models.refresh awaits the credential-store read before invoking the provider's cache-only restore phase."
rust_behavior = "ModelsRegistry restores and policy-validates cached models before beginning credential-store or auth work."
owner = "pi-ai-core::models-auth"
rationale = "A slow, failed, or quarantined credential backend must not prevent publication of already cached public catalog data."
compatibility_consequence = "Provider/store call order differs and a cached snapshot may become visible before a later credential-read error is reported."
replacement_fixture = "conformance/ai-models/cache-before-credential-read"
revisit_trigger = "Upstream restores cache before credential access or cache visibility is redesigned."

[[divergence]]
id = "ai.models-error-detail-redaction"
upstream_behavior = "ModelsError appends formatted thrown cause detail to its public message, and tests require the combined text."
rust_behavior = "ModelsError Display and Debug expose only a fixed category while retaining the backend error through Error::source."
owner = "pi-ai-core::models-auth"
rationale = "Provider, credential, endpoint, and transport causes may contain secrets and are unsafe as default user-visible diagnostics."
compatibility_consequence = "Ordinary Rust error text is generic; trusted diagnostics must deliberately traverse the redacted source boundary."
replacement_fixture = "conformance/ai-models/models-error-detail-redaction"
revisit_trigger = "Upstream adopts structured secret-classified causes or the Rust diagnostics policy changes."

[[divergence]]
id = "ai.models-publication-value-capability"
upstream_behavior = "A provider publication may carry an update JavaScript callback that mutates provider-private model state after persistence."
rust_behavior = "A borrow-scoped ModelsPublisher accepts independent persistence and memory value intents and never stores an update callback."
owner = "pi-ai-core::models-auth"
rationale = "Publication order and state authority must be inspectable values rather than executable callback identity."
compatibility_consequence = "Provider ports compute replacement snapshots and submit them as values; closure-based publication requires adaptation."
replacement_fixture = "conformance/ai-models/models-publication-value-capability"
revisit_trigger = "Upstream replaces update callbacks with ordered value publications."

[[divergence]]
id = "ai.registry-async-mutation-fence"
upstream_behavior = "Provider set, delete, and clear mutate the registry synchronously while older refresh work is cancelled separately."
rust_behavior = "Provider mutation methods are async and return only after the per-provider sequencer has fenced older publication and persistence work."
owner = "pi-ai-core::models-auth"
rationale = "A completed replacement must prove that a stale blocked store write cannot later overwrite the new generation."
compatibility_consequence = "Callers await set/delete/clear and cannot assume mutation completion at synchronous return."
replacement_fixture = "conformance/ai-models/registry-async-mutation-fence"
revisit_trigger = "Upstream provider mutation exposes an equivalent completion fence."

[[divergence]]
id = "ai.models-store-exclusive-owner"
upstream_behavior = "A ModelsStore is injected by reference and the public contract does not forbid sharing it among live Models collections."
rust_behavior = "One live ModelsRegistry exclusively consumes one model-store capability; cross-registry fencing is not claimed."
owner = "pi-ai-core::models-auth"
rationale = "The registry-owned publication sequencer can guarantee last-writer order only when it is the store's sole live authority."
compatibility_consequence = "Applications needing multiple registries provide separate stores or a future store-level fencing implementation."
replacement_fixture = "conformance/ai-models/models-store-exclusive-owner"
revisit_trigger = "A cross-registry/cross-process model-store fencing-token contract is approved."

