schema_version = 1
production_crates = [
  "pi-telemetry",
  "pi-extension-protocol",
  "pi-ai-core",
  "pi-ai-transport",
  "pi-ai-providers",
  "pi-ai",
  "pi-agent-schema",
  "pi-agent-loop",
  "pi-agent-session",
  "pi-agent-sqlite",
  "pi-harness-core",
  "pi-harness-runtime",
  "pi-agent-search",
  "pi-agent",
  "pi-coding-runtime",
]

[test_only_package]
name = "runtime-extension-profiles-alloc"
path = "crates/pi-harness-runtime/tests/runtime_extension_profiles_alloc"
consumer = "pi-harness-runtime"

[[feature_group]]
id = "provider-selection"
members = ["provider-*", "oauth-*", "images-*", "catalog-gen"]

[[feature_group]]
id = "ai-facade-provider-selection"
members = ["compat", "catalog-anthropic", "catalog-deepseek", "catalog-google", "catalog-openai", "catalog-openai-codex", "catalog-openrouter", "catalog-openrouter-images", "provider-anthropic", "provider-deepseek", "provider-google", "provider-openai", "provider-openai-codex", "provider-openrouter", "images-runtime", "images-openrouter", "oauth-anthropic", "oauth-openai-codex", "oauth-openrouter", "all-providers", "all-images", "all-oauth", "native", "auth-native", "catalog-gen", "dev-oauth-cli"]

