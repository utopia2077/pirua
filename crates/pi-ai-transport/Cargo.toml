[package]
name = "pi-ai-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ring = { workspace = true, optional = true }
brotli-decompressor.workspace = true
flate2.workspace = true
zstd-safe.workspace = true
pi-ai-core.workspace = true
httpdate.workspace = true
url.workspace = true
base64 = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
h2 = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
zlib-rs = { workspace = true, optional = true }

[features]
default = []
auth-native = ["native", "dep:ring"]
native = ["dep:base64", "dep:futures-util", "dep:hyper", "dep:h2", "dep:hyper-util", "dep:http-body-util", "dep:rustls-platform-verifier", "dep:tokio", "dep:tokio-rustls", "dep:tokio-tungstenite", "dep:webpki-roots", "dep:zlib-rs"]

[dev-dependencies]
serde_json.workspace = true
