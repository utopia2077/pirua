[package]
name = "pi-ai-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
wire-pi-messages = ["dep:url"]
wire-mistral-conversations = ["dep:url"]
wire-anthropic-messages = ["dep:url"]
wire-openai-responses = ["dep:url"]
wire-openai-completions = ["dep:url"]
wire-google-genai = ["dep:url"]
native = ["pi-ai-transport/native"]

[dependencies]
pi-ai-core.workspace = true
pi-ai-transport.workspace = true
ryu-js.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
url = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
