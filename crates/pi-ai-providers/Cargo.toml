[package]
name = "pi-ai-providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
provider-anthropic = ["wire-anthropic-messages", "catalog-anthropic"]
provider-deepseek = ["wire-openai-completions", "catalog-deepseek"]
provider-google = ["wire-google-genai", "catalog-google"]
provider-openai = ["wire-openai-responses", "catalog-openai"]
provider-openai-codex = ["wire-openai-codex-responses", "catalog-openai-codex"]
provider-openrouter = ["wire-openai-completions", "catalog-openrouter"]
images-openrouter = ["wire-openrouter-images", "catalog-openrouter-images"]
all-providers = ["provider-anthropic", "provider-deepseek", "provider-google", "provider-openai", "provider-openai-codex", "provider-openrouter"]
all-images = ["images-openrouter"]
all-oauth = ["oauth-anthropic", "oauth-openai-codex", "oauth-openrouter"]
default = []
wire-openrouter-images = ["dep:url"]
catalog-openai = []
catalog-google = []
catalog-anthropic = []
catalog-deepseek = []
catalog-openai-codex = []
catalog-openrouter = []
catalog-openrouter-images = []
oauth-anthropic = ["dep:url"]
oauth-openai-codex = ["dep:url"]
oauth-openrouter = ["dep:url"]
auth-native = ["native", "pi-ai-transport/auth-native"]
cloudflare-gateway-binding = ["dep:url", "serde_json/unbounded_depth"]
wire-openai-codex-responses = ["dep:url"]
wire-pi-messages = ["dep:url"]
wire-mistral-conversations = ["dep:url"]
wire-anthropic-messages = ["dep:url"]
wire-openai-responses = ["dep:url"]
wire-azure-openai-responses = ["dep:url"]
wire-openai-completions = ["dep:url"]
wire-google-genai = ["dep:url"]
wire-google-vertex = ["dep:url"]
wire-bedrock-converse-stream = ["dep:url", "dep:ring"]
native = ["pi-ai-transport/native"]

[dependencies]
pi-ai-core.workspace = true
pi-ai-transport.workspace = true
ryu-js.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
url = { workspace = true, optional = true }
ring = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
