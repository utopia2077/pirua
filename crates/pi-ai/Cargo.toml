[package]
name = "pi-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
dev-catalog-tools = []
compat = []
catalog-anthropic = ["dep:pi-ai-providers", "pi-ai-providers/catalog-anthropic"]
catalog-deepseek = ["dep:pi-ai-providers", "pi-ai-providers/catalog-deepseek"]
catalog-google = ["dep:pi-ai-providers", "pi-ai-providers/catalog-google"]
catalog-openai = ["dep:pi-ai-providers", "pi-ai-providers/catalog-openai"]
catalog-openai-codex = ["dep:pi-ai-providers", "pi-ai-providers/catalog-openai-codex"]
catalog-openrouter = ["dep:pi-ai-providers", "pi-ai-providers/catalog-openrouter"]
catalog-openrouter-images = ["dep:pi-ai-providers", "pi-ai-providers/catalog-openrouter-images"]
provider-anthropic = ["catalog-anthropic", "pi-ai-providers/provider-anthropic"]
provider-deepseek = ["catalog-deepseek", "pi-ai-providers/provider-deepseek"]
provider-google = ["catalog-google", "pi-ai-providers/provider-google"]
provider-openai = ["catalog-openai", "pi-ai-providers/provider-openai"]
provider-openai-codex = ["catalog-openai-codex", "pi-ai-providers/provider-openai-codex"]
provider-openrouter = ["catalog-openrouter", "pi-ai-providers/provider-openrouter"]
images-runtime = ["dep:pi-ai-providers"]
images-openrouter = ["images-runtime", "catalog-openrouter-images", "pi-ai-providers/images-openrouter"]
oauth-anthropic = ["dep:pi-ai-providers", "pi-ai-providers/oauth-anthropic"]
oauth-openai-codex = ["dep:pi-ai-providers", "pi-ai-providers/oauth-openai-codex"]
oauth-openrouter = ["dep:pi-ai-providers", "pi-ai-providers/oauth-openrouter"]
all-providers = ["provider-anthropic", "provider-deepseek", "provider-google", "provider-openai", "provider-openai-codex", "provider-openrouter"]
all-images = ["images-openrouter"]
all-oauth = ["oauth-anthropic", "oauth-openai-codex", "oauth-openrouter"]
native = ["dep:pi-ai-providers", "pi-ai-providers/native"]
auth-native = ["native", "pi-ai-providers/auth-native"]

[dependencies]
pi-ai-core.workspace = true
pi-ai-providers = { workspace = true, optional = true }
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true

[[bin]]
name = "catalog_gen"
path = "src/bin/catalog_gen.rs"
required-features = ["dev-catalog-tools"]

[[bin]]
name = "image_catalog_gen"
path = "src/bin/image_catalog_gen.rs"
required-features = ["dev-catalog-tools"]
