[package]
name = "pi-ai"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
dev-catalog-tools = []
compat = []
provider-anthropic = ["dep:pi-ai-providers"]

[dependencies]
pi-ai-core.workspace = true
pi-ai-providers = { workspace = true, optional = true }
serde_json.workspace = true

[dev-dependencies]
tokio.workspace = true

[[bin]]
name = "catalog_gen"
path = "src/bin/catalog_gen.rs"
required-features = ["dev-catalog-tools"]

[[bin]]
name = "image_catalog_gen"
path = "src/bin/image_catalog_gen.rs"
required-features = ["dev-catalog-tools"]
