[package]
name = "pi-coding-runtime"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
provider-anthropic = ["pi-ai/provider-anthropic"]
provider-deepseek = ["pi-ai/provider-deepseek"]
provider-google = ["pi-ai/provider-google"]
provider-openai = ["pi-ai/provider-openai"]
oauth-anthropic = ["pi-ai/oauth-anthropic"]
oauth-openai-chatgpt = ["pi-ai/oauth-openai-chatgpt"]

[dependencies]
pi-agent-schema.workspace = true
pi-agent.workspace = true
pi-coding-session.workspace = true
pi-extension-protocol.workspace = true
pi-mcp.workspace = true
pi-codemode.workspace = true
ring.workspace = true
futures-util.workspace = true
pi-ai.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
regex.workspace = true
base64.workspace = true
url.workspace = true
unicode-normalization = "=0.1.25"
yaml_serde = "=0.10.7"
image = { version = "=0.25.9", default-features = false, features = ["bmp", "png", "jpeg", "gif", "webp"] }
similar = { version = "=3.2.0", default-features = false, features = ["text"] }

[[test]]
name = "tools"
path = "tests/tools.rs"

[[test]]
name = "model_composition"
path = "tests/model_composition.rs"

[[test]]
name = "model_defaults"
path = "tests/model_defaults.rs"

[[test]]
name = "settings_snapshot"
path = "tests/settings_snapshot.rs"

[[test]]
name = "target_tools"
path = "tests/target_tools.rs"

[[test]]
name = "local_boundaries"
path = "tests/local_boundaries.rs"

[dependencies.ignore]
version = "=0.4.33"

[[test]]
name = "session_runtime"
path = "tests/session_runtime.rs"

[[test]]
name = "session_source"
path = "tests/session_source.rs"

[dev-dependencies]
prost.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "mcp_adapter"
path = "tests/mcp_adapter.rs"

[[test]]
name = "codemode_adapter"
path = "tests/codemode_adapter.rs"

[[test]]
name = "extensions"
path = "tests/extensions.rs"

[[test]]
name = "bash_execution"
path = "tests/bash_execution.rs"
